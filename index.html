<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" type="image/x-icon" href="./svg/bookshelf.svg">
    <script src="./script.js" defer></script>
    <title>Library</title>
</head>
<body>
    <div class=container>
        <header>
            <div class="logo-button-container">
            <div class="logo-container">
                <img src="./svg/bookshelf.svg">
                <h2>Simple Library</h2>
            </div>
            <div class="button-container">
                <button id="add-book-button">+ Add Book</button>
                <div class="modal" id="modal">
                    <div class="modal-inner">
                        <div class="modal-header">
                            <h5>Add New Book</h5>
                        </div>
                        <hr>
                        <form action="script.js" method="POST" id="form">
                            <div class="form-container">
                            <div class="form-group">
                                <label class="label-group" for="book_title">Title</label>
                                <input type="text" id="book_title" name="book_title" required>
                            </div>
                            <div class="form-group">
                                <label class="label-group" for="book_author">Author</label>
                                <input type="text" id="book_author" name="book_author" required>
                            </div>
                            <div class="form-group">
                                <label class="label-group" for="book_pages">Pages</label>
                                <input type="number" id="book_pages" name="book_pages" required>
                            </div>
                            <div id="form-checkbox">
                                <input type="checkbox" id="book_read" name="book_read">
                                <label class="label-group" for="book_read">Already read?</label>
                            </div>
                            </div>
                        <hr>
                        <div class="modal-buttons">
                            <button type="reset" value="reset" id="cancel">Cancel</button>
                            <button type="submit" value="submit" id="submit">+ Add Book</button>
                        </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
        <div class="status-container">
            <div class="status-card">
                <p id="total">3</p>
                <p class="status">Total</p>
                </div>
            <div class="status-card">
                    <p id="read">0</p>
                    <p class="status">Read</p>
            </div>
            <div class="status-card">
                <p id="unread">3</p>
                <p class="status">To Read</p>
            </div>
        </div>
        </header>
        <main>
            <h3>Your Books</h3>
            <div class="books-container">
            </div>
        </main>
    </div>
</body>
</html>
