<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" type="image/x-icon" href="./svg/bookshelf.svg">
    <script src="./script.js" defer></script>
    <title>Library</title>
</head>
<body>
    <div class=container>
        <header>
            <div class="logo-button-container">
            <div class="logo-container">
                <img src="./svg/bookshelf.svg">
                <h2>Simple Library</h2>
            </div>
            <div class="button-container">
                <button id="add-book-button">+ Add Book</button>
            </div>
        </div>
        <div class="status-container">
            <div class="status-card">
                <p id="total">3</p>
                <p class="status">Total</p>
                </div>
            <div class="status-card">
                    <p id="read">0</p>
                    <p class="status">Read</p>
            </div>
            <div class="status-card">
                <p id="unread">3</p>
                <p class="status">To Read</p>
            </div>
        </div>
        </header>
        <main>
            <h3>Your Books</h3>
            <div class="books-container">
            </div>
        </main>
    </div>
</body>
</html>
